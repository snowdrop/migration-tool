name: "CI - JDK 21 Build"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/project.yml'
  pull_request:
    branches: [ main ]


jobs:
  build-jdk21:
    name: "JDK 21 Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test
        run: mvn clean install -ntp -B

  # The MCP server is released as 2 uber-jars, one per transport (property mcp.transport): build and test both of them
  # as they are packaged (unit tests + integration tests launching the packaged server).
  mcp-transport:
    name: "MCP server - ${{ matrix.transport }} transport"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [ stdio, http ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install the modules used by the MCP server
        run: mvn install -ntp -B -pl mcp -am -DskipTests
      - name: Build and test the MCP server (${{ matrix.transport }})
        run: |
          mvn clean verify -ntp -B -pl mcp -Dmcp.transport=${{ matrix.transport }}
          ls -l mcp/target/mcp-*-${{ matrix.transport }}.jar
      - name: Run the integration tests against the packaged MCP server (${{ matrix.transport }})
        run: mvn clean verify -ntp -B -pl mcp -Pit -Dmcp.transport=${{ matrix.transport }}
