name: "CI - Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vars.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME # Sonatype "snowdrop-team" usertoken: username
          server-password: MAVEN_PASSWORD # Sonatype "snowdrop-team" usertoken: password
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }} # snowdrop-core@redhat.com gpg private key
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # snowdrop-core@redhat.com gpg passphrase

      - name: Configure git user and email
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "Github Action"

      - name: Create a release branch
        run: |
          VERSION=${{ github.event.inputs.version }}
          git checkout -b release-$VERSION

      - name: Set the maven version to the release version
        run: |
          VERSION=${{ github.event.inputs.version }}
          mvn -ntp -B versions:set versions:commit -DprocessAllModules=true -DprocessParent -DnewVersion=$VERSION

      # NOT NEED AS WE USE AS CONVENTION: "script-ref": "dev.snowdrop.mtool:migration-cli:RELEASE:runner"
      #- name: Update jbang-catalog.json
      #  run: |
      #    VERSION=${{ github.event.inputs.version }}
      #    RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/migration-cli-$VERSION-runner.jar"
      #    echo "Updating catalog with new URL: ${RELEASE_URL}"
      #    jq --arg url "$RELEASE_URL" '.aliases.mtool["script-ref"] = $url' jbang-catalog.json > temp.json && mv temp.json jbang-catalog.json

      - name: Update the cookbook rules using the snowdrop openrewrite recipes jar
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Bump the yaml rules containing the snowdrop openrewrite recipes jar too"
          find cookbook/rules -name "*.yaml" -exec sed -i "s|dev.snowdrop.mtool:openrewrite-recipes:[0-9.]*\(-SNAPSHOT\)\{0,1\}|dev.snowdrop.mtool:openrewrite-recipes:$VERSION|g" {} +
          find tests/src/test/resources/cookbook -name "*.yaml" -exec sed -i "s|dev.snowdrop.mtool:openrewrite-recipes:[0-9.]*\(-SNAPSHOT\)\{0,1\}|dev.snowdrop.mtool:openrewrite-recipes:$VERSION|g" {} +

      - name: Commit the changes
        run: |
          VERSION=${{ github.event.inputs.version }}
          git add .
          git commit -m "release: ${VERSION} and jbang catalog update"

      - name: Build the project
        run: |
          mvn -ntp -B clean install

      # The MCP server is released as 2 distinct uber-jars, one per transport: stdio and http (property mcp.transport).
      # Without mcp.transport, both transports are packaged (local development only): this jar is never released.
      # The http uber-jar is built first and then attached (classifier: http) to the deployment of the mcp module
      # which builds the stdio uber-jar (classifier: stdio), as Maven Central only accepts one deployment per GAV.
      - name: Build the MCP server uber-jar using the http transport
        run: |
          VERSION=${{ github.event.inputs.version }}
          mvn -ntp -B package -pl mcp -DskipTests -Dmcp.transport=http
          cp mcp/target/mcp-$VERSION-http.jar ${{ runner.temp }}/mcp-$VERSION-http.jar

      - name: Deploy the maven GAV on central
        run: |
          VERSION=${{ github.event.inputs.version }}
          mvn -ntp -B clean deploy -Prelease -DskipTests -Dmcp.transport=stdio -Dmcp.attach.jar=${{ runner.temp }}/mcp-$VERSION-http.jar
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Push branch and Create Pull Request
        run: |
          VERSION=${{ github.event.inputs.version }}
          
          git push origin release-$VERSION
          
          gh pr create \
            --title "Release $VERSION" \
            --body "Automated release PR" \
            --base main \
            --head release-$VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

