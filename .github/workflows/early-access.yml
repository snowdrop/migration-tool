name: CI - Early Access

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  precheck:
    if: github.repository == 'snowdrop/migration-tool' && startsWith(github.event.head_commit.message, 'Releasing version') != true
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vars.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cancel previous run
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Version
        id: vars
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$(echo $VERSION)" >> $GITHUB_OUTPUT

  release:
    needs: [ precheck ]
    if: endsWith(${{ needs.precheck.outputs.VERSION }}, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME # Sonatype "snowdrop-team" usertoken: username
          server-password: MAVEN_PASSWORD # Sonatype "snowdrop-team" usertoken: password
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }} # snowdrop-core@redhat.com gpg private key
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # snowdrop-core@redhat.com gpg passphrase

      - name: Configure git user and email
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "Github Action"

      - name: Build the project
        run: |
          mvn -ntp -B clean install -DskipTests

      # See release.yml: the MCP server is published as 2 uber-jars, one per transport (classifiers: stdio and http)
      - name: Build the MCP server uber-jar using the http transport
        run: |
          VERSION=${{ needs.precheck.outputs.VERSION }}
          mvn -ntp -B package -pl mcp -DskipTests -Dmcp.transport=http
          cp mcp/target/mcp-$VERSION-http.jar ${{ runner.temp }}/mcp-$VERSION-http.jar

      - name: Deploy the maven GAV on central
        run: |
          VERSION=${{ needs.precheck.outputs.VERSION }}
          mvn -ntp -B clean deploy -Prelease -DskipTests -Dmcp.transport=stdio -Dmcp.attach.jar=${{ runner.temp }}/mcp-$VERSION-http.jar
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
