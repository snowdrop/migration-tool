quarkus.log.console.stderr=true
quarkus.banner.enabled=false

# Quarkus Log
quarkus.log.file.enabled=true
quarkus.log.file.path=quarkus-mcp-mtool.log

# MCP
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=1000

mtool.validator-packages=dev.snowdrop.mtool.validate
mtool.allowed-dirs=.